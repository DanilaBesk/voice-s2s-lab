services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/voice-s2s-venv
      UV_LINK_MODE: copy
      VOICE_S2S_SESSION_DIR: /app/.local/sessions
      VOICE_S2S_MODEL_CACHE_DIR: /app/data/models
      VOICE_S2S_ENABLE_REAL_MODEL: "true"
      HF_HOME: /app/data/models/huggingface
    ports:
      - "18000:8000"
    volumes:
      - ./backend:/app/backend
      - ./scripts:/app/scripts:ro
      - ./.local:/app/.local
      - ./data/models:/app/data/models
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:18000
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    working_dir: /app/frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - backend
