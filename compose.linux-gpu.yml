name: voice-s2s-lab

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.linux-gpu
    env_file:
      - .env
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/voice-s2s-venv
      UV_LINK_MODE: copy
      VOICE_S2S_SESSION_DIR: /srv/voice-s2s/sessions
      VOICE_S2S_MODEL_CACHE_DIR: /srv/voice-s2s/models
      VOICE_S2S_ENABLE_REAL_MODEL: "true"
      HF_HOME: /srv/voice-s2s/models/huggingface
      HF_HUB_CACHE: /srv/voice-s2s/models/huggingface
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "1800"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    gpus: all
    ports:
      - "18000:8000"
    volumes:
      - ./data/models:/srv/voice-s2s/models
      - ./.local/sessions:/srv/voice-s2s/sessions
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:80"
    restart: unless-stopped
