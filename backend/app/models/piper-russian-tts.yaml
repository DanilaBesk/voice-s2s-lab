    license: MIT
    size_bytes: 63206117
    size_label: "63 MB"
    tier: lightweight
    availability: available
    type: text_to_audio
    capabilities:
      - text_to_audio
      - tts
    voices:
      - id: ru_RU-denis-medium
        display_name: Denis
        language: ru-RU
        gender: male
        sample_rate: 22050
        notes: "Russian Piper medium voice. Dataset license in model card: CC0."
    adapter: piper_tts
    runtime: subprocess
    mode: turn_based
    language_notes: "Russian text-to-speech voice for local Piper runtime. The rhasspy/piper-voices repo is MIT and the voice model card lists the dataset license as CC0."
    hardware_notes: "Runs on CPU through Piper. No GPU required."
    install_notes: "Run: uv run --extra tts python ../scripts/install-tts-models.py --models piper-ru-ru-denis-medium"
    supports_prompt: true
    supports_streaming: false
    input_sample_rate: 16000
    output_sample_rate: 22050
    enabled: true
    default: false
    config:
      piper_executable: piper
      model_path: data/models/piper/ru_RU-denis-medium.onnx
      config_path: data/models/piper/ru_RU-denis-medium.onnx.json
      timeout_s: 120

