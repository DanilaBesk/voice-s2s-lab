  - id: f5-tts-russian-mlx-4bit
    display_name: F5 Russian MLX 4-bit
    hf_repo: ink-splatters/f5-tts-russian-mlx
    source_url: https://huggingface.co/ink-splatters/f5-tts-russian-mlx
    license: MIT
    size_bytes: 232491451
    size_label: "222 MiB"
    tier: around-250mb
    availability: available
    type: text_to_audio
    capabilities:
      - text_to_audio
      - tts
    voices:
      - id: reference-voice
        display_name: Reference voice
        language: ru-RU
        sample_rate: 24000
        notes: "Zero-shot F5 voice matching. Uses configured ref_audio_path/ref_text when provided; otherwise uses the f5-tts-mlx package smoke reference."
    adapter: f5_mlx_tts
    runtime: in_process
    mode: turn_based
    language_notes: "MIT Russian F5-TTS MLX community weights. This is a zero-shot/reference-voice adapter, not a fixed named voice."
    hardware_notes: "Requires Apple Silicon MLX runtime and the f5-tts-mlx optional dependency. Not intended for Linux GPU Docker runtime."
    install_notes: "Run: uv sync --extra f5-mlx && uv run python ../scripts/install-tts-models.py --models f5-tts-russian-mlx-4bit"
    supports_prompt: true
    supports_streaming: false
    input_sample_rate: 24000
    output_sample_rate: 24000
    enabled: true
    default: false
    config:
      model_dir: data/models/research/huggingface/ink-splatters__f5-tts-russian-mlx
      model_file: model_4b.safetensors
      required_files:
        - model_4b.safetensors
        - vocab.txt
      vocoder_model_dir: data/models/huggingface/lucasnewman__vocos-mel-24khz
      required_vocoder_files:
        - config.yaml
        - model.safetensors
      quantization_bits: 4
      ref_text: "Some call me nature, others call me mother nature."
      duration_s: 2.8
      max_duration_s: 8.0
      steps: 8
      method: rk4
      cfg_strength: 2.0
      speed: 1.0
      sway_sampling_coef: -1.0

