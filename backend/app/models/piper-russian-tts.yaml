  - id: synthetic-local-tts
    display_name: Synthetic Local TTS
    hf_repo:
    type: text_to_audio
    capabilities:
      - text_to_audio
      - tts
    voices:
      - id: synthetic-local
        display_name: Synthetic Local
        language: ru-RU
        sample_rate: 22050
        notes: "Deterministic test voice that writes a tone WAV and does not use model weights."
    adapter: synthetic_tts
    runtime: in_process
    mode: turn_based
    language_notes: "Test-friendly local TTS fixture; text is echoed and audio is a deterministic tone."
    hardware_notes: "Runs on CPU with only the Python standard library."
    install_notes: "Included with the backend for automated tests. Not intended as a production voice."
    supports_prompt: true
    supports_streaming: false
    input_sample_rate: 16000
    output_sample_rate: 22050
    enabled: false
    default: false
    config: {}
