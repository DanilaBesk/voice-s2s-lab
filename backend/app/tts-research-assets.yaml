models:
  - id: qwen3-tts-0-6b-base
    install_dir: data/models/research/huggingface/Qwen__Qwen3-TTS-12Hz-0.6B-Base
    source: huggingface
    hf_repo: Qwen/Qwen3-TTS-12Hz-0.6B-Base
    license: Apache-2.0
    runtime_status: download_only_no_adapter
    notes: "Official Qwen3-TTS 0.6B Base. Large modern voice-clone/design candidate; no project runtime adapter yet."
    allow_patterns:
      - README.md
      - config.json
      - generation_config.json
      - merges.txt
      - model.safetensors
      - preprocessor_config.json
      - speech_tokenizer/*
      - tokenizer_config.json
      - vocab.json

  - id: f5-tts-russian-mlx-4bit
    install_dir: data/models/research/huggingface/ink-splatters__f5-tts-russian-mlx
    source: huggingface
    hf_repo: ink-splatters/f5-tts-russian-mlx
    license: MIT
    runtime_status: download_only_no_adapter
    notes: "Russian F5-TTS MLX community weights. Downloaded as permissive research asset; the project has no F5/MLX runtime adapter yet."
    allow_patterns:
      - README.md
      - model_4b.safetensors
      - vocab.txt

  - id: rhvoice-russian-core-and-voices
    install_dir: data/models/research/rhvoice
    source: url
    license: GPL-2.0/voice-specific licenses
    runtime_status: download_only_no_adapter
    notes: "RHVoice Russian language and two Russian voice repositories. Source/voice assets only; no project runtime adapter yet."
    assets:
      - url: https://github.com/RHVoice/Russian/archive/refs/heads/main.zip
        path: RHVoice-Russian-main.zip
      - url: https://github.com/RHVoice/anna-rus/archive/refs/heads/main.zip
        path: RHVoice-anna-rus-main.zip
      - url: https://github.com/RHVoice/aleksandr-rus/archive/refs/heads/main.zip
        path: RHVoice-aleksandr-rus-main.zip
