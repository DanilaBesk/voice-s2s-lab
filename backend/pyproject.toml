[project]
name = "voice-s2s-lab-backend"
version = "0.1.0"
description = "Local speak-to-speak lab backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.2",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]
test = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]
qwen = [
  "soundfile==0.13.1",
  "pillow>=10.4.0",
  "accelerate>=0.26.0",
  "qwen-omni-utils==0.0.9",
  "torch>=2.1,<2.7",
  "torchvision>=0.21,<0.22",
  "transformers==4.52.3",
]
tts = [
  "piper-tts==1.4.2",
  "huggingface-hub>=0.34.0",
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile==0.13.1",
  "torch>=2.1,<2.7",
  "transformers==4.52.3",
  "vosk-tts==0.3.61",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
